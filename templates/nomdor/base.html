<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nomdor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #171717;
        }


        /* ========================= */
        /* HEADER */
        /* ========================= */

        header {
            height: 112px;

            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;

            padding: 0 40px;

            gap: 35px;
        }


        .logo {
            font-size: 36px;
            font-weight: bold;

            color: #743d91;
        }


        nav {
            display: flex;

            gap: 28px;

            align-items: center;
        }


        nav a {
            text-decoration: none;

            color: #222;

            font-size: 18px;
        }


        nav a:hover {
            color: #743d91;
        }


        .order-btn {
            margin-left: auto;

            background: #743d91;

            color: white;

            padding: 14px 25px;

            border-radius: 30px;

            border: none;

            font-size: 16px;

            cursor: pointer;
        }


        .phone {
            font-size: 18px;

            font-weight: bold;
        }


        /* ========================= */
        /* MENU LAYOUT */
        /* ========================= */

        .menu-layout {
            display: flex;

            align-items: flex-start;

            gap: 30px;

            padding: 30px 40px;
        }


        /* ========================= */
        /* KATEGORIYALAR */
        /* ========================= */

        .categories {
            width: 180px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            flex-shrink: 0;
        }


        .category {
            display: block;

            text-decoration: none;

            color: #222;

            padding: 14px 20px;

            border-radius: 30px;

            font-size: 17px;

            white-space: nowrap;

            transition: 0.2s;
        }


        .category:hover {
            background: #f3eafa;

            color: #743d91;
        }


        .category:first-child {
            border: 1px solid #743d91;

            color: #743d91;
        }


        /* ========================= */
        /* O'NG TOMON */
        /* ========================= */

        .menu-products {
            flex: 1;

            min-width: 0;
        }


        /* ========================= */
        /* MENU TITLE */
        /* ========================= */

        .menu-title {
            display: flex;

            align-items: center;

            gap: 20px;

            margin: 0 0 25px;
        }


        .menu-title span {
            height: 1px;

            background: #d9bfdc;

            flex: 1;
        }


        .menu-title h1 {
            font-size: 38px;
        }


        /* ========================= */
        /* PRODUCTS */
        /* ========================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            padding-bottom: 50px;
        }


        /* ========================= */
        /* PRODUCT LINK */
        /* ========================= */

        .product-link {
            text-decoration: none;

            color: inherit;

            display: block;
        }


        /* ========================= */
        /* PRODUCT CARD */
        /* ========================= */

        .product-card {
            border: 1px solid #e5e5e5;

            border-radius: 18px;

            overflow: hidden;

            background: white;

            cursor: pointer;

            transition: 0.2s;
        }


        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.10);
        }


        /* ========================= */
        /* PRODUCT IMAGE */
        /* ========================= */

        .product-image {
            position: relative;

            height: 380px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: white;
        }


        .product-image img {
            width: 90%;

            height: 90%;

            object-fit: contain;

            display: block;
        }


        /* ========================= */
        /* LIKE */
        /* ========================= */

        .like {
            position: absolute;

            right: 20px;

            top: 20px;

            width: 45px;

            height: 45px;

            border-radius: 50%;

            background: white;

            border: none;

            font-size: 30px;

            color: #999;

            cursor: pointer;

            z-index: 5;

            transition: 0.2s;
        }


        .like:hover {
            transform: scale(1.15);
        }


        .like.liked {
            color: red;
        }


        /* ========================= */
        /* PRODUCT INFO */
        /* ========================= */

        .product-info {
            padding: 15px;
        }


        .product-info h2 {
            font-size: 20px;

            font-weight: 500;

            margin-bottom: 10px;
        }


        .product-info p {
            color: #777;

            margin-bottom: 15px;
        }


        /* ========================= */
        /* PRICE */
        /* ========================= */

        .product-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }


        .product-bottom strong {
            font-size: 25px;
        }


        /* ========================= */
        /* BATAFSIL */
        /* ========================= */

        .detail-btn {
            border: 1px solid #743d91;

            color: #743d91;

            border-radius: 10px;

            padding: 10px 18px;

            font-size: 15px;

            white-space: nowrap;

            transition: 0.2s;
        }


        .product-card:hover .detail-btn {
            background: #743d91;

            color: white;
        }


        /* ========================= */
        /* TABLET */
        /* ========================= */

        @media (max-width: 1100px) {

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        /* ========================= */
        /* TELEFON */
        /* ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }


            .logo {
                font-size: 28px;
            }


            nav {
                display: none;
            }


            .phone {
                display: none;
            }


            .menu-layout {
                flex-direction: column;

                padding: 20px;
            }


            .categories {
                width: 100%;

                flex-direction: row;

                overflow-x: auto;

                padding-bottom: 10px;
            }


            .category {
                flex-shrink: 0;
            }


            .products {
                grid-template-columns: 1fr;
            }


            .menu-title h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Nomdor
    </div>


    <nav>

        <a href="{% url 'menu' %}">
            Biz haqimizda
        </a>

        <a href="{% url 'category' %}">
            Menyu
        </a>

        <a href="#">
            Aksiyalar
        </a>

        <a href="#">
            Ish o'rinlari
        </a>

        <a href="#">
            Filiallar
        </a>

        <a href="#">
            Aloqa
        </a>

    </nav>


    <button class="order-btn">
        Buyurtma turi
    </button>


    <div class="phone">
        +998 71 207 04 04
    </div>

</header>


{% block content %}

{% endblock %}


</body>

</html>
