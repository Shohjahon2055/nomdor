<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nomdor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #171717;
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        header {
            min-height: 112px;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;

            padding: 15px 40px;
            gap: 30px;

            background: white;

            position: relative;
            z-index: 100;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #743d91;
            white-space: nowrap;
        }

        nav {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-size: 17px;
        }

        nav a:hover {
            color: #743d91;
        }


        /* ========================= */
        /* ORDER BUTTON */
        /* ========================= */

        .order-btn {
            margin-left: auto;

            background: #743d91;
            color: white;

            padding: 13px 22px;

            border-radius: 30px;

            border: none;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        .order-btn:hover {
            background: #5f3277;
        }


        /* ========================= */
        /* PHONE */
        /* ========================= */

        .phone {
            font-size: 15px;
        }

        .phone-number {
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
        }


        /* ========================= */
        /* ACCOUNT ACTIONS */
        /* ========================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-item {
            text-decoration: none;
            color: #222;

            display: flex;
            align-items: center;

            gap: 4px;

            white-space: nowrap;

            transition: 0.2s;
        }

        .header-item:hover {
            color: #743d91;
        }

        .username {
            color: #743d91;
            font-weight: bold;
        }

        .logout {
            color: #dc3545;
        }

        .logout:hover {
            color: #a71d2a;
        }


        /* ========================= */
        /* MENU LAYOUT */
        /* ========================= */

        .menu-layout {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            padding: 30px 40px;
        }


        /* ========================= */
        /* CATEGORIES */
        /* ========================= */

        .categories {
            width: 180px;

            display: flex;
            flex-direction: column;

            gap: 10px;

            flex-shrink: 0;

            position: sticky;
            top: 20px;

            height: fit-content;
        }

        .category {
            display: block;

            text-decoration: none;

            color: #222;

            padding: 14px 20px;

            border-radius: 30px;

            font-size: 17px;

            white-space: nowrap;

            transition: 0.2s;
        }

        .category:hover {
            background: #f3eafa;
            color: #743d91;
        }

        .category:first-child {
            border: 1px solid #743d91;
            color: #743d91;
        }


        /* ========================= */
        /* PRODUCTS */
        /* ========================= */

        .menu-products {
            flex: 1;
            min-width: 0;
        }

        .menu-title {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 0 0 25px;
        }

        .menu-title span {
            height: 1px;
            background: #d9bfdc;
            flex: 1;
        }

        .menu-title h1 {
            font-size: 38px;
            white-space: nowrap;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-bottom: 50px;
        }


        /* ========================= */
        /* PRODUCT LINK */
        /* ========================= */

        .product-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }


        /* ========================= */
        /* PRODUCT CARD */
        /* ========================= */

        .product-card {
            border: 1px solid #e5e5e5;

            border-radius: 18px;

            overflow: hidden;

            background: white;

            cursor: pointer;

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.10);
        }


        /* ========================= */
        /* PRODUCT IMAGE */
        /* ========================= */

        .product-image {
            position: relative;

            height: 380px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: white;

            overflow: hidden;
        }

        .product-image img {
            width: 90%;
            height: 90%;

            object-fit: contain;

            display: block;

            transition: transform 0.4s ease;
        }

        .product-card:hover
        .product-image img {
            transform: scale(1.12);
        }


        /* ========================= */
        /* LIKE BUTTON */
        /* ========================= */

        .like {
            position: absolute;

            right: 20px;
            top: 20px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: white;

            border: none;

            font-size: 30px;

            color: #999;

            cursor: pointer;

            z-index: 5;

            transition: 0.2s;
        }

        .like:hover {
            transform: scale(1.15);
        }


        /* ========================= */
        /* PRODUCT INFO */
        /* ========================= */

        .product-info {
            padding: 15px;
        }

        .product-info h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .product-info p {
            color: #777;
            margin-bottom: 15px;
            line-height: 1.4;
        }


        /* ========================= */
        /* PRODUCT BOTTOM */
        /* ========================= */

        .product-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }

        .product-bottom strong {
            font-size: 25px;
            white-space: nowrap;
        }


        /* ========================= */
        /* DETAIL BUTTON */
        /* ========================= */

        .detail-btn {
            border: 1px solid #743d91;

            color: #743d91;

            border-radius: 10px;

            padding: 10px 18px;

            font-size: 15px;

            white-space: nowrap;

            transition: 0.2s;
        }

        .product-card:hover
        .detail-btn {
            background: #743d91;
            color: white;
        }


        /* ========================= */
        /* TABLET */
        /* ========================= */

        @media (max-width: 1100px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            header {
                padding: 15px 20px;
                gap: 20px;
            }

            .logo {
                font-size: 30px;
            }
        }


        /* ========================= */
        /* MOBILE */
        /* ========================= */

        @media (max-width: 700px) {

            header {
                min-height: 80px;

                padding: 10px 15px;

                gap: 15px;
            }

            .logo {
                font-size: 28px;
            }

            nav {
                display: none;
            }

            .phone {
                display: none;
            }

            .order-btn {
                padding: 10px 15px;

                font-size: 14px;
            }

            .menu-layout {
                flex-direction: column;

                padding: 0;

                gap: 0;
            }

            .categories {
                width: 100%;

                flex-direction: row;

                overflow-x: auto;

                gap: 8px;

                padding: 15px;

                background: white;

                border-bottom: 1px solid #eee;

                position: sticky;

                top: 0;

                z-index: 50;

                height: auto;
            }

            .category {
                flex-shrink: 0;

                padding: 11px 18px;

                font-size: 15px;
            }

            .menu-products {
                width: 100%;

                padding: 0 15px;
            }

            .menu-title {
                margin: 25px 0 20px;
            }

            .menu-title h1 {
                font-size: 30px;
            }

            .products {
                grid-template-columns: 1fr;

                gap: 20px;
            }

            .product-image {
                height: 330px;
            }
        }


        /* ========================= */
        /* SMALL MOBILE */
        /* ========================= */

        @media (max-width: 400px) {

            .product-image {
                height: 280px;
            }

            .product-bottom strong {
                font-size: 21px;
            }

            .detail-btn {
                padding: 8px 12px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header>


    <!-- LOGO -->

    <div class="logo">
        Nomdor
    </div>


    <!-- MENU -->

    <nav>

        <a href="{% url 'about' %}">
            Biz haqimizda
        </a>

        <a href="{% url 'category' %}">
            Menyu
        </a>

        <a href="{% url 'aksiya' %}">
            Aksiyalar
        </a>

        <a href="#">
            Ish o'rinlari
        </a>

        <a href="#">
            Filiallar
        </a>

        <a href="#">
            Aloqa
        </a>

    </nav>


    <!-- BUYURTMA -->

    <button class="order-btn">

    <!-- PHONE + ACCOUNT -->

    <div class="phone">

            {% if user.is_authenticated %}

                <!-- LOGIN QILGAN USER -->

                <span class="header-item username">

                <!-- CHIQISH -->

                <a
                    href="{% url 'logout' %}"

                    🚪
                    <span>Chiqish</span>

                </a>


            {% else %}

                <!-- LOGIN QILMAGAN USER -->

                <a
                    href="{% url 'login' %}"
                    class="header-item">

                    👤
                    <span>Kirish</span>

                </a>


                <a
                    href="{% url 'register' %}"
                    class="header-item">

                    📝
                    <span>Ro‘yxatdan o‘tish</span>

                </a>


            {% endif %}


            <!-- QIDIRUV -->

            <a
                href="{% url 'search' %}"
                class="header-item">

                🔍
                <span>Qidiruv</span>

            </a>


            <!-- SAVAT -->

            <a
                href="#"
                class="header-item">

                🛒
                <span>Savat</span>

            </a>


        </div>

    </div>

</header>


<!-- ========================= -->
<!-- CONTENT -->
<!-- ========================= -->

{% block content %}

{% endblock %}


</body>

</html>
