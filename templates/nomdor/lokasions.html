{% extends "nomdor/base.html" %}

{% block content %}
<style>
    .filial-page {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 40px;
    }

    .filial-header {
        margin-bottom: 24px;
    }

    .filial-header h1 {
        font-size: 36px;
        font-weight: bold;
        color: #171717;
    }

    .filial-header h1 span {
        color: #743d91;
    }

    .filial-header p {
        color: #666;
        font-size: 16px;
        margin-top: 8px;
    }

    .filial-map-box {
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #e5e5e5;
        height: 480px;
        background: #fafafa;
    }

    .filial-map-box iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    @media (max-width: 700px) {
        .filial-page {
            padding: 0 15px;
            margin: 25px auto;
        }

        .filial-header h1 {
            font-size: 28px;
        }

        .filial-map-box {
            height: 350px;
        }
    }
</style>

<div class="filial-page">
    <div class="filial-header">
        <h1>Bizning <span>filiallarimiz</span></h1>
        <p>Xaritadan filialimiz joylashuvini ko‘rishingiz mumkin.</p>
    </div>

    <div class="filial-map-box">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3243.315357570706!2d69.63998169999999!3d40.9031037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38ae33613686d703%3A0xfffafcd0682a39a8!2sOHANGARON%20DEHQON%20BOZORI!5e1!3m2!1suz!2s!4v1795281952399!5m2!1suz!2s"
            width="100%"
            height="100%"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
</div>
{% endblock %}
